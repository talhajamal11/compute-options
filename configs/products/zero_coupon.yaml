# Zero-coupon note: redemption solved at par gives the issuer's yield. No compute exposure.
underlying: {instrument: ornn:H100_SXM, series: benchmarks}   # or e.g. {instrument: B200, series: composite_index}
product:
  kind: zero_coupon
  tenor: 1.0
solve_for: redemption
issue_price: 1.0
issuer_margin: 0.0
market: {vol_method: realized, vol_window: 90, vol_horizon_days: 7, forward_model: flat, rate: null, issuer_spread: 0.01}
backtest: {issue_every_days: 7, hedge: false}
