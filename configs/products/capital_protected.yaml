# 100% capital-protected note on H100: participation solved so fair value = 100% - 1% margin.
underlying:
  # Ornn OCPI: transaction-based, the kind of index listed futures settle on. Posted-price
  # composites (series: composite_chained / composite_level, instrument: H100_SXM, B200, ...)
  # have longer history but understate volatility because list prices are sticky.
  instrument: ornn:H100_SXM
  series: benchmarks
product:
  kind: capital_protected
  tenor: 0.5                    # years
  protection: 1.0
  strike: 1.0
  cap: 1.5
solve_for: participation
issue_price: 1.0
issuer_margin: 0.01
market:
  vol_method: realized          # realized | ewma | ou
  vol_window: 90                # calendar days
  vol_horizon_days: 7           # weekly returns: filters day-to-day index noise
  forward_model: flat           # flat | schwartz
  rate: null                    # null -> FRED Treasury curve; or a flat rate, e.g. 0.04
  issuer_spread: 0.01
backtest:
  issue_every_days: 7
  hedge: true
