[project]
name = "compute-options"
version = "0.1.0"
description = "Market data, option pricing and structured-product backtesting on GPU compute rental prices."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Talha Jamal" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
compute-options = "compute_options.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
    "jupyterlab>=4",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_options"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live data endpoints (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008"]  # frozen-dataclass config defaults are immutable

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
